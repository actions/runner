name: Create Issue on Workflow Failure

on:
    workflow_run:
        # List the exact 'name:' values of the workflows you want to monitor.
        workflows:
            - "Runner CI"
            - "Runner CD"
            - "Update Runner Patches (Commit-to-Commit)"
            - "Update Runner Patches (Release-to-Release)"
        types:
            - completed

# Permissions required to create an issue and read repository contents
permissions:
    issues: write
    contents: read

jobs:
    create-issue:
        # Only run this job if the triggered workflow concluded with a failure
        if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Create GitHub Issue on Failure
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
                  RUN_URL: ${{ github.event.workflow_run.html_url }}
                  REPOSITORY: ${{ github.repository }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
              run: |
                  ISSUE_TITLE="CI/CD Pipeline Failed: ${WORKFLOW_NAME}"
                  ISSUE_MARKER="workflow-run-id:${RUN_ID}"
                  ISSUE_BODY=$'The GitHub Actions workflow **'"${WORKFLOW_NAME}"'** has failed.\n\n**Run URL:** '"${RUN_URL}"'\n**Run ID:** '"${RUN_ID}"'\n\n'"${ISSUE_MARKER}"$'\n\nPlease investigate and resolve the issue.'

                  # Check if an issue for this specific workflow run already exists to prevent duplicate spam on retries
                  EXISTING_ISSUE=$(gh issue list --repo "${REPOSITORY}" --state open --search "\"${ISSUE_MARKER}\" in:body" --json number --jq '.[0].number // empty')
                  if [ -n "$EXISTING_ISSUE" ]; then
                    echo "An issue for this workflow run already exists (#${EXISTING_ISSUE}). Skipping creation."
                  else
                    # gh issue create fails outright if a label is missing, so (re)create it first
                    gh label create "ci-failure" \
                      --repo "${REPOSITORY}" \
                      --description "Automated CI/CD pipeline failure" \
                      --color "B60205" \
                      --force
                    gh issue create \
                      --repo "${REPOSITORY}" \
                      --title "${ISSUE_TITLE}" \
                      --body "${ISSUE_BODY}" \
                      --label "bug" \
                      --label "ci-failure"
                  fi
