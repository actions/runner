name: TICS

on:
  schedule:
    - cron: "0 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tics:
    name: TICS
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted-linux-amd64-noble-large-tiobe
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build & layout
        working-directory: src
        run: ./dev.sh layout Release linux-x64

      # dev.sh installs its own SDK under _dotnetsdk/<version>; dotnet-coverage and TICS
      # need DOTNET_ROOT to find it.
      - name: Locate .NET SDK
        run: |
          DOTNET_DIR="$(dirname "$(ls "${GITHUB_WORKSPACE}"/_dotnetsdk/*/dotnet | head -n1)")"
          echo "DOTNET_ROOT=${DOTNET_DIR}" >> "$GITHUB_ENV"
          echo "${DOTNET_DIR}" >> "$GITHUB_PATH"
          echo "${HOME}/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Run L0 tests with coverage
        working-directory: src
        run: |
          # The self-hosted runner's job hooks leak into JobExtension L0 tests and add a step
          unset ACTIONS_RUNNER_HOOK_JOB_STARTED ACTIONS_RUNNER_HOOK_JOB_COMPLETED
          dotnet tool update --global dotnet-coverage
          dotnet-coverage collect --output-format cobertura \
            --output "${GITHUB_WORKSPACE}/.coverage/cobertura.xml" "./dev.sh test"

      # Test runs write hundreds of gitignored logs that TICS would otherwise pick up as
      # source files, tripping its sanity check on the number of new files.
      - name: Remove test artifacts
        run: rm -rf src/Test/TestLogs _downloads

      - name: TICS GitHub Action
        uses: tiobe/tics-github-action@v3
        with:
          mode: qserver
          project: github-actions-runner
          branchdir: ${{ github.workspace }}
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          installTics: true

concurrency:
  group: tics
  cancel-in-progress: false
