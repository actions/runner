name: Update skills submodule

on:
  repository_dispatch:
    types: [skills-updated]
  workflow_dispatch:
    inputs:
      sha:
        description: 'SakThai-skills SHA to record in PR body (optional)'
        required: false

concurrency:
  group: update-skills-submodule
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Bump skills/sakthai-skills to latest main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Initialize or update submodule
        run: |
          # Register submodule if the git tree entry does not exist yet
          if ! git ls-files --error-unmatch skills/sakthai-skills 2>/dev/null; then
            echo "Submodule not yet registered -- running git submodule add"
            git submodule add \
              https://github.com/beernanthasit-hub/SakThai-skills.git \
              skills/sakthai-skills
          else
            git submodule update --init skills/sakthai-skills
          fi
          # Pull latest from tracked branch (main, per .gitmodules branch=main)
          git submodule update --remote skills/sakthai-skills

      - name: Create or update bump PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/bump-skills-submodule
          delete-branch: true
          commit-message: |
            chore: bump skills/sakthai-skills submodule to latest

            Skills SHA: ${{ github.event.client_payload.sha || inputs.sha || 'latest' }}
          title: "chore: bump skills/sakthai-skills submodule to latest"
          body: |
            ## Automated Skills Submodule Bump

            This PR was opened automatically by the `update-skills-submodule`
            workflow, triggered by a push to `beernanthasit-hub/SakThai-skills`.

            | Field | Value |
            |-------|-------|
            | Skills SHA | `${{ github.event.client_payload.sha || inputs.sha || 'n/a' }}` |
            | Skills ref | `${{ github.event.client_payload.ref || 'refs/heads/main' }}` |
            | Actor | `${{ github.event.client_payload.actor || github.actor }}` |
            | Trigger | `${{ github.event_name }}` |

            Merge this PR to update the pinned skills version in SakThai.
          labels: automated,dependencies

      - name: Report outcome
        if: steps.cpr.outputs.pull-request-url != ''
        run: echo "Bump PR ${{ steps.cpr.outputs.pull-request-operation }} at ${{ steps.cpr.outputs.pull-request-url }}"
